<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - IE</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; text-align: center; }
        .card { background: white; border-radius: 12px; padding: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; margin-top: 0; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .mensaje { padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 1.1em; display: none; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { color: white; border: none; padding: 10px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; margin: 4px; font-weight: bold; }
        .btn-drive { background: #1a73e8; }
        .btn-drive:hover { background: #1557b0; }
        .btn-excel { background: #1e7e34; }
        .btn-danger { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #edf2f7; }
        .campo-responsable { margin-bottom: 12px; text-align: left; font-size: 13px; color: #444; }
        .campo-responsable input { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control de Asistencia</h2>
    <p style="color: #666; margin-top: -8px;">IEP 72313 SANTA ROSA DE HUAYRAPATA</p>

    <!-- Identificador de la persona o puerta que toma asistencia -->
    <div class="campo-responsable">
        <label><b>Puerta / Responsable de turno:</b></label>
        <input type="text" id="responsable" placeholder="Ej: Puerta 1 / Prof. Edgar" onchange="guardarResponsable()">
    </div>

    <!-- Visor de la Cámara -->
    <div id="reader"></div>

    <!-- Mensaje de confirmación -->
    <div id="mensaje" class="mensaje"></div>

    <!-- Botones de Acción -->
    <div>
        <button class="btn-drive" onclick="enviarADrive()">☁️ Enviar a mi Drive</button>
        <button class="btn-excel" onclick="exportarExcel()">📥 Excel Local</button>
        <button class="btn-danger" onclick="limpiarRegistros()">🗑️ Limpiar</button>
    </div>

    <!-- Resumen -->
    <h3 style="margin-top: 20px; text-align: left;">Registros Locales (<span id="total">0</span>)</h3>
    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>DNI</th>
                <th>Personal</th>
                <th>Drive</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo"></tbody>
    </table>
</div>

<script>
    // ========================================================
    // 1. CONFIGURACIÓN PRINCIPAL (PEGA AQUÍ TU ENLACE DE DRIVE)
    // ========================================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxG_TQ48-e0btOTeJ5pldwpZdr7f6iinxbTWqIaZbhOrkjCyGOizczyJE30vXZQpKkw/exec";

    // 2. PADRÓN DE PERSONAL DE TU IE
    const PADRON = {
        "80930776": "LIMACHE TICONA, PEDRO DE LUGO (Estudiante 5to)",
		"79595613": "LUQUE TICONA, JHON KEVIN (Estudiante 5to)",
		"79446113": "MAMANI URBINA, YOSELIN FANY (Estudiante 5to)",
		"78692244": "CCAMA TICONA, LUZ GUADALUPE (Estudiante 6to)",
		"78765593": "HANCCO AJAHUANA, SHEYLA XHAMIRA (Estudiante 6to)",
        "78690497": "HUAHUALUQUE GIL, YORDY OLIVER (Estudiante 6to)",
		"80930770": "LIPE CHUQUIJA, NEYMAR ANTHONY (Estudiante 6to)",
		"80930777": "LUQUE TICONA, LEYDI YARITA (Estudiante 6to)",
		"47870859": "LUQUE MOLLEAPAZA, JOSE LUIS (Personal Administrativo)",
		"80644638": "PINTO CAPIA, RICARDO (DOCENTE IV CICLO)",
		"48399333": "PARIAPAZA ENRIQUEZ, YESENIA (DOCENTE III CICLO)",
		"41866544": "PORTO LOPEZ, Edgar (DOCENTE)"
    };

    let registros = JSON.parse(localStorage.getItem("asistencia_ie") || "[]");
    document.getElementById("responsable").value = localStorage.getItem("responsable_ie") || "";
    actualizarTabla();

    function guardarResponsable() {
        localStorage.setItem("responsable_ie", document.getElementById("responsable").value);
    }

    // 3. ESCÁNER DE CÁMARA
    const html5QrCode = new Html5Qrcode("reader");
    let ultimoEscaneo = "";
    let tiempoBloqueo = false;

    function onScanSuccess(decodedText) {
        let dni = decodedText.trim();
        if (tiempoBloqueo && dni === ultimoEscaneo) return;

        tiempoBloqueo = true;
        ultimoEscaneo = dni;
        setTimeout(() => { tiempoBloqueo = false; }, 3000);

        let ahora = new Date();
        let fecha = ahora.toISOString().split("T")[0];
        let hora = ahora.toLocaleTimeString();

        let nombre = PADRON[dni] || "Personal No Empadronado";
        let esValido = PADRON[dni] !== undefined;
        let resp = document.getElementById("responsable").value || "General";

        let nuevoRegistro = {
            fecha: fecha,
            hora: hora,
            dni: dni,
            nombre: nombre,
            responsable: resp,
            dispositivo: navigator.userAgent.includes("Android") ? "Móvil Android" : "Laptop/PC",
            subidoDrive: false
        };

        registros.unshift(nuevoRegistro);
        guardarLocal();
        reproducirBeep(esValido);
        mostrarMensaje(esValido ? `✅ REGISTRADO: ${nombre}` : `⚠️ DNI ${dni} REGISTRADO (NO EN PADRÓN)`, esValido);
        actualizarTabla();

        // Intentar envío automático inmediato a Drive si hay conexión
        subirRegistroIndividual(nuevoRegistro);
    }

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
    ).catch(err => {
        mostrarMensaje("Error al abrir cámara: active permisos.", false);
    });

    // 4. ENVÍO A GOOGLE DRIVE
    function subirRegistroIndividual(item) {
        if (!URL_APPS_SCRIPT || URL_APPS_SCRIPT.includes("PEGA_AQUI")) return;
        
        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(item)
        }).then(() => {
            item.subidoDrive = true;
            guardarLocal();
            actualizarTabla();
        }).catch(e => {
            console.log("Sin conexión, queda pendiente de sincronizar.");
        });
    }

    function enviarADrive() {
        if (!URL_APPS_SCRIPT || URL_APPS_SCRIPT.includes("PEGA_AQUI")) {
            alert("Falta configurar la URL de Google Apps Script en el código.");
            return;
        }

        let pendientes = registros.filter(r => !r.subidoDrive);
        let aEnviar = pendientes.length > 0 ? pendientes : registros;

        if (aEnviar.length === 0) {
            alert("No hay registros para enviar.");
            return;
        }

        mostrarMensaje("Sincronizando con Google Drive...", true);

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(aEnviar)
        }).then(() => {
            registros.forEach(r => r.subidoDrive = true);
            guardarLocal();
            actualizarTabla();
            mostrarMensaje("✅ ¡Sincronizado con éxito en tu Google Drive!", true);
        }).catch(err => {
            mostrarMensaje("❌ Error de conexión al enviar a Drive.", false);
        });
    }

    function guardarLocal() {
        localStorage.setItem("asistencia_ie", JSON.stringify(registros));
    }

    function actualizarTabla() {
        const cuerpo = document.getElementById("tabla-cuerpo");
        cuerpo.innerHTML = "";
        document.getElementById("total").innerText = registros.length;

        registros.slice(0, 15).forEach(r => {
            let estadoDrive = r.subidoDrive ? "<span style='color:green;'>✔️ Sí</span>" : "<span style='color:orange;'>⏳ Pend.</span>";
            let fila = `<tr><td>${r.hora}</td><td>${r.dni}</td><td>${r.nombre}</td><td>${estadoDrive}</td></tr>`;
            cuerpo.innerHTML += fila;
        });
    }

    // 5. EXPORTAR EXCEL Y LIMPIEZA
    function exportarExcel() {
        if (registros.length === 0) { alert("No hay asistencias registradas."); return; }
        let csv = "\uFEFFFecha,Hora,DNI,Apellidos y Nombres,Responsable,Subido a Drive\n";
        registros.forEach(r => {
            csv += `"${r.fecha}","${r.hora}","${r.dni}","${r.nombre}","${r.responsable}","${r.subidoDrive ? 'SI' : 'NO'}"\n`;
        });
        let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        let url = URL.createObjectURL(blob);
        let link = document.createElement("a");
        link.href = url;
        link.download = `Asistencia_${new Date().toISOString().split("T")[0]}.csv`;
        link.click();
    }

    function limpiarRegistros() {
        if (confirm("¿Vaciar registros locales de esta pantalla? Recuerda asegurarte de que estén sincronizados a tu Drive.")) {
            registros = [];
            guardarLocal();
            actualizarTabla();
            mostrarMensaje("Registros locales vaciados.", true);
        }
    }

    function mostrarMensaje(txt, exito) {
        const msg = document.getElementById("mensaje");
        msg.innerText = txt;
        msg.className = "mensaje " + (exito ? "exito" : "error");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 3500);
    }

    function reproducirBeep(esValido) {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(esValido ? 880 : 300, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }
</script>

</body>
</html>
