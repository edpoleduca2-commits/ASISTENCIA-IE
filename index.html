<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - IE</title>
    <!-- Librería libre y gratuita para leer QR con la cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; text-align: center; }
        .card { background: white; border-radius: 12px; padding: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; margin-top: 0; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .mensaje { padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 1.1em; display: none; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { background: #2b6cb0; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; margin: 5px; }
        button:hover { background: #2c5282; }
        .btn-excel { background: #22543d; }
        .btn-excel:hover { background: #1c4532; }
        .btn-danger { background: #9b2c2c; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #edf2f7; }
    </style>
</head>
<body>

<div class="card">
    <h2>IEP N° 72313 SANTA ROSA DE HUAYRAPATA</h2>
    <p style="color: #666; margin-top: -10px;">CONTROL DE ASISTENCIA</p>

    <!-- Visor de la Cámara -->
    <div id="reader"></div>

    <!-- Mensaje de confirmación -->
    <div id="mensaje" class="mensaje"></div>

    <!-- Acciones -->
    <div>
        <button class="btn-excel" onclick="exportarExcel()">📥 Descargar en Excel</button>
        <button class="btn-danger" onclick="limpiarRegistros()">🗑️ Borrar Todo</button>
    </div>

    <!-- Resumen de hoy -->
    <h3 style="margin-top: 20px; text-align: left;">Últimas Marcaciones (<span id="total">0</span>)</h3>
    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>DNI</th>
                <th>Personal</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo"></tbody>
    </table>
</div>

<script>
    // 1. PADRÓN DE PERSONAL DE TU IE (Edita aquí tus profesores y trabajadores)
    const PADRON = {
        "80930776": "LIMACHE TICONA, Pedro de Logo (ESTUDIANTE 5TO)",
        "79595613": "LUQUE TICONA, Jhon Kevin (ESTUDIANTE 5TO)",
        "79141485": "MAMANI URBINA, Yoselin Fany (ESTUDIANTE 5TO)",
        "78692244": "CCAMA TICONA, Luz Guadalupe (ESTUDIANTE 6TO)",
        "78765593": "HANCCO AJAHUANA, Sheyla Xhamira (ESTUDIANTE 6TO)",
        "78690497": "HUAHUALUQUE GIL, Yordy Oliver (ESTUDIANTE 6TO)",
        "80930770": "LIPE CHUQUIJA, Neymar Anthony (ESTUDIANTE 6TO)",
	"80930777": "LUQUE TICONA, Leydi Yarita (ESTUDIANTE 6TO)"
    };

    let registros = JSON.parse(localStorage.getItem("asistencia_ie") || "[]");
    actualizarTabla();

    // 2. CONFIGURACIÓN DEL ESCÁNER QR
    const html5QrCode = new Html5Qrcode("reader");
    let ultimoEscaneo = "";
    let tiempoBloqueo = false;

    function onScanSuccess(decodedText) {
        let dni = decodedText.trim();

        if (tiempoBloqueo && dni === ultimoEscaneo) return;

        tiempoBloqueo = true;
        ultimoEscaneo = dni;
        setTimeout(() => { tiempoBloqueo = false; }, 3000); // 3 segundos de margen

        let ahora = new Date();
        let fecha = ahora.toISOString().split("T")[0];
        let hora = ahora.toLocaleTimeString();

        let nombre = PADRON[dni] || "Personal No Empadronado";
        let esValido = PADRON[dni] !== undefined;

        // Guardar asistencia en la memoria del celular/laptop
        registros.unshift({ fecha: fecha, hora: hora, dni: dni, nombre: nombre });
        localStorage.setItem("asistencia_ie", JSON.stringify(registros));

        // Sonido de éxito
        reproducirBeep(esValido);

        // Mostrar aviso en pantalla
        mostrarMensaje(esValido ? `✅ REGISTRADO: ${nombre}` : `⚠️ DNI ${dni} REGISTRADO (NO EN PADRÓN)`, esValido);
        actualizarTabla();
    }

    // Iniciar cámara trasera por defecto (o webcam en laptop)
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
    ).catch(err => {
        mostrarMensaje("Error al abrir cámara: active los permisos.", false);
    });

    // 3. MOSTRAR TABLA EN PANTALLA
    function actualizarTabla() {
        const cuerpo = document.getElementById("tabla-cuerpo");
        cuerpo.innerHTML = "";
        document.getElementById("total").innerText = registros.length;

        registros.slice(0, 10).forEach(r => {
            let fila = `<tr><td>${r.hora}</td><td>${r.dni}</td><td>${r.nombre}</td></tr>`;
            cuerpo.innerHTML += fila;
        });
    }

    // 4. DESCARGAR REPORTE DIRECTO A EXCEL (.CSV)
    function exportarExcel() {
        if (registros.length === 0) {
            alert("No hay asistencias registradas aún.");
            return;
        }

        let csvContent = "\uFEFFFecha,Hora,DNI,Apellidos y Nombres\n";
        registros.forEach(r => {
            csvContent += `"${r.fecha}","${r.hora}","${r.dni}","${r.nombre}"\n`;
        });

        let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        let url = URL.createObjectURL(blob);
        let link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Asistencia_${new Date().toISOString().split("T")[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function limpiarRegistros() {
        if (confirm("¿Seguro que deseas vaciar todos los registros del día? Recuerda descargar el Excel primero.")) {
            registros = [];
            localStorage.removeItem("asistencia_ie");
            actualizarTabla();
            mostrarMensaje("Registros eliminados correctamente.", true);
        }
    }

    function mostrarMensaje(txt, exito) {
        const msg = document.getElementById("mensaje");
        msg.innerText = txt;
        msg.className = "mensaje " + (exito ? "exito" : "error");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 3500);
    }

    function reproducirBeep(esValido) {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(esValido ? 880 : 300, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }
</script>

</body>
</html>
